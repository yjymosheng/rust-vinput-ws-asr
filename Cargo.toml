[package]
name = "vinput-ws-asr"
version = "0.1.0"
edition = "2021"
description = "Rust realtime WebSocket ASR streaming provider for vLLM /v1/realtime (Qwen3-ASR)"

[lib]
name = "vinput_ws_asr"
path = "src/lib.rs"

[[bin]]
name = "vinput-ws-provider"
path = "src/bin/provider.rs"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.28.0" }
futures-util = { version = "0.3.34", features = ["sink"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
base64 = "0.22.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
